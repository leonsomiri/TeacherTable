<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessons Schedule - Scope Ark</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          scopebg: '#faf3e8',
          scopecard: '#fffdf8',
          scopeborder: '#e6dcc8',
          scopetext: '#243b30',
          scopemuted: '#7a7563',
          scopegreen: '#22402f',
          scopegold: '#c9973f',
          scopegood: '#2f8f5f',
          scopebad: '#c0453f',
        }
      }
    }
  }
</script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="m-0 min-h-screen bg-scopebg text-scopetext font-sans">
<header class="px-5 pt-8 pb-5 text-center">
  <div class="flex flex-col items-center gap-1.5 mb-3.5">
    <img src="assets/logo.png" alt="Scope Ark logo" width="40" height="40" class="w-10 h-10 object-contain">
    <div class="text-2xl font-bold tracking-wide text-scopegreen">SCOPE<span class="text-scopegold">ARK</span></div>
  </div>
  <h1 class="m-0 text-3xl font-bold text-scopegreen">Teacher Lessons Schedule</h1>
</header>

<div class="max-w-5xl mx-auto px-4 pb-10">
  <div class="flex justify-center mb-4">
    <select id="filterTeacher" class="w-full max-w-xs px-3 py-2.5 rounded-lg border border-scopeborder bg-scopecard text-scopetext text-sm">
      <option value="">All Teachers</option>
    </select>
  </div>

  <div id="stats" class="flex gap-2.5 flex-wrap justify-center mb-4"></div>

  <div id="cards" class="grid gap-3.5" style="grid-template-columns:repeat(auto-fill, minmax(280px,1fr))"></div>
  <div id="empty" class="text-center text-scopemuted py-10 hidden">No lessons found</div>
</div>

<footer class="text-center text-scopemuted text-sm px-5 pt-6 pb-8 border-t border-scopeborder mt-5">
  <div class="text-scopegreen font-bold mb-1">Scope Ark Online Academy</div>
  <a href="https://www.scopeark.com" target="_blank" rel="noopener" class="text-scopegold font-semibold hover:underline">www.scopeark.com</a>
  <span id="liveStatus" class="block mt-2 text-xs">Loading...</span>
  <div class="mt-3 text-xs text-scopemuted">Corporate website: scopeark.net. &copy; 2026 Scope Ark. All rights reserved.</div>
</footer>

<script>
// Live public "view-only" copy of the Lessons_Schedule sheet (kept in sync via
// an IMPORTRANGE formula in the source spreadsheet). This is a *separate*
// spreadsheet containing only this one tab, so no other sensitive tabs are
// exposed publicly.
const LIVE_SHEET_ID = '1NWhEULW5C6WBMvBEiErt7wy1oywMvFWDVhxcLptxaLo';
const LIVE_CSV_URL = `https://docs.google.com/spreadsheets/d/${LIVE_SHEET_ID}/gviz/tq?tqx=out:csv`;
const REFRESH_MS = 60000; // refresh every 60 seconds

const FIELDS = ['Lesson_ID','Student_ID','Student_Name','Student_TimeZone','Teacher_ID',
  'Teacher_Name','Teacher_TimeZone','Subject','Stage','Day_Name','Actual_Date','Month','Year',
  'Student_Date','Teacher_Date','Day_Index','Start_Time_Student','End_Time_Student',
  'Start_Time_Teacher','End_Time_Teacher','CAIRO_TIME','MEET_LINK','Status','Reason','Note',
  'Added_By','Comment','T_MSG','T_WTS','STD_MSG','STD_WTS'];

let allLessons = [];

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function csvToLessons(text){
  const rows = parseCSV(text).filter(r=>r.some(c=>c !== ''));
  if(rows.length < 2) return [];
  const header = rows[0];
  const idx = {};
  header.forEach((h,i)=>idx[h.trim()] = i);
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    const lessonIdCell = idx['Lesson_ID'] !== undefined ? row[idx['Lesson_ID']] : '';
    if(!lessonIdCell) continue;
    const item = {};
    FIELDS.forEach(f=>{
      item[f] = idx[f] !== undefined ? (row[idx[f]] || '') : '';
    });
    out.push(item);
  }
  return out;
}

function setLiveStatus(msg){
  document.getElementById('liveStatus').textContent = msg;
}

async function fetchLive(){
  const res = await fetch(`${LIVE_CSV_URL}&_=${Date.now()}`, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if(text.includes('#REF!') || text.includes('#ERROR!')){
    throw new Error('live sheet not linked yet');
  }
  return csvToLessons(text);
}

async function loadData(isRefresh){
  try{
    allLessons = await fetchLive();
    const now = new Date().toLocaleTimeString('en-US');
    setLiveStatus(`Live data · last updated: ${now} · refreshes every ${REFRESH_MS/1000}s`);
  } catch(err){
    if(!isRefresh){
      // first load fallback to bundled snapshot so the page isn't empty
      try{
        const res = await fetch('data/lessons_schedule.json');
        allLessons = await res.json();
      } catch(e){ allLessons = []; }
    }
    setLiveStatus(`Could not load live data (${err.message}) — showing cached data`);
  }
  populateTeacherFilter();
  render();
}

setInterval(()=>loadData(true), REFRESH_MS);

function dayNameFromDate(dateStr){
  if(!dateStr) return '';
  let y, m, d;
  const iso = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  const us = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(iso){ y = +iso[1]; m = +iso[2]; d = +iso[3]; }
  else if(us){ m = +us[1]; d = +us[2]; y = +us[3]; }
  else return '';
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString('en-US', {weekday: 'long', timeZone: 'UTC'});
}

function badgeClasses(status){
  const s = (status || '').toLowerCase();
  if(s === 'scheduled') return 'bg-scopegreen/10 text-scopegreen';
  if(s === 'trail') return 'bg-scopegold/20 text-scopegold';
  if(s === 'trail_done') return 'bg-scopegood/15 text-scopegood';
  if(s === 'rescheduled') return 'bg-scopebad/15 text-scopebad';
  return 'bg-scopemuted/10 text-scopemuted';
}

const VISIBLE_STATUSES = ['scheduled', 'trail', 'rescheduled'];

function statusLabel(status){
  if(!status) return '-';
  if(status.toLowerCase() === 'trail') return 'Trial';
  return status;
}

function populateTeacherFilter(){
  const sel = document.getElementById('filterTeacher');
  const prev = sel.value;
  const teachers = [...new Set(allLessons
    .filter(l=>VISIBLE_STATUSES.includes((l.Status||'').toLowerCase()))
    .map(l=>l.Teacher_Name).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">All Teachers</option>';
  teachers.forEach(t=>{
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    sel.appendChild(o);
  });
  if(teachers.includes(prev)) sel.value = prev;
}

function row(icon, label, value){
  return `
    <div class="flex justify-between items-start text-sm text-scopemuted gap-2">
      <span class="flex items-center gap-1.5 shrink-0"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</span>
      <span class="text-scopetext font-medium text-right">${value}</span>
    </div>`;
}

function render(){
  const teacherFilter = document.getElementById('filterTeacher').value;

  const sorted = allLessons
    .filter(l=>VISIBLE_STATUSES.includes((l.Status||'').toLowerCase()))
    .filter(l=>!teacherFilter || l.Teacher_Name === teacherFilter)
    .sort((a,b)=>(a.Teacher_Name||'').localeCompare(b.Teacher_Name||''));

  const cards = document.getElementById('cards');
  const empty = document.getElementById('empty');
  cards.innerHTML = '';

  if(sorted.length === 0){
    empty.classList.remove('hidden');
  } else {
    empty.classList.add('hidden');
    sorted.forEach(l=>{
      const card = document.createElement('div');
      card.className = 'bg-scopecard border border-scopeborder rounded-2xl p-4 flex flex-col gap-2 shadow-sm';
      const day = `${l.Teacher_Date || '-'}${dayNameFromDate(l.Teacher_Date) ? ' (' + dayNameFromDate(l.Teacher_Date) + ')' : ''}`;
      const time = `${l.Start_Time_Teacher || '-'} - ${l.End_Time_Teacher || '-'} (${l.Teacher_TimeZone || '-'})`;
      card.innerHTML = `
        <div class="flex items-center gap-2 -mx-4 -mt-4 mb-1 px-4 py-2.5 rounded-t-2xl text-white font-bold text-lg bg-gradient-to-b from-teal-500 to-teal-700 shadow-[inset_0_1px_0_rgba(255,255,255,0.35),inset_0_-2px_4px_rgba(0,0,0,0.2),0_2px_4px_rgba(0,0,0,0.2)]">
          <i data-lucide="user" class="w-4 h-4"></i>${l.Teacher_Name || '-'}
        </div>
        <div class="flex justify-between items-center">
          <span class="flex items-center gap-1.5 font-semibold text-sm text-scopegold"><i data-lucide="book-open" class="w-3.5 h-3.5"></i>${l.Subject || '-'}</span>
          <span class="text-xs px-2.5 py-1 rounded-full font-semibold whitespace-nowrap ${badgeClasses(l.Status)}">${statusLabel(l.Status)}</span>
        </div>
        ${row('graduation-cap', 'Student', l.Student_Name || '-')}
        ${row('calendar', 'Day', day)}
        ${row('clock', 'Time (Teacher)', time)}
        ${row('building-2', 'Admin Time', l.CAIRO_TIME || '-')}
        ${l.MEET_LINK ? `<a class="mt-1.5 flex items-center justify-center gap-1.5 text-center py-2 rounded-lg bg-scopegreen text-white no-underline text-sm font-semibold hover:opacity-90" href="https://${l.MEET_LINK}" target="_blank" rel="noopener"><i data-lucide="video" class="w-4 h-4"></i>Join Lesson</a>` : ''}
      `;
      cards.appendChild(card);
    });
  }

  document.getElementById('stats').innerHTML = `
    <div class="bg-scopecard border border-scopeborder rounded-xl px-4 py-2.5 text-sm text-scopemuted text-center">
      <b class="block text-scopegreen text-lg">${sorted.length}</b>Lessons Shown
    </div>
  `;

  if(window.lucide) lucide.createIcons();
}

document.getElementById('filterTeacher').addEventListener('change', render);

loadData();
</script>
</body>
</html>
