<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessons Schedule - Scope Ark</title>
<style>
  :root{
    --bg:#faf3e8;
    --card:#fffdf8;
    --border:#e6dcc8;
    --text:#243b30;
    --muted:#7a7563;
    --green:#22402f;
    --gold:#c9973f;
    --good:#2f8f5f;
    --warn:#c9973f;
    --bad:#c0453f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
  }
  header{
    padding:32px 20px 20px;
    text-align:center;
  }
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    margin-bottom:14px;
  }
  .brand svg{
    width:64px;
    height:64px;
  }
  .brand .name{
    font-size:1.4rem;
    font-weight:700;
    color:var(--green);
    letter-spacing:.5px;
  }
  .brand .name .ark{
    color:var(--gold);
  }
  header h1{
    margin:0;
    font-size:1.8rem;
    color:var(--green);
  }
  .container{
    max-width:1100px;
    margin:0 auto;
    padding:0 16px 40px;
  }
  .stats{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
    justify-content:center;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 18px;
    font-size:.85rem;
    color:var(--muted);
    text-align:center;
  }
  .stat b{
    display:block;
    color:var(--green);
    font-size:1.15rem;
  }
  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:14px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:8px;
    box-shadow:0 1px 3px rgba(34,64,47,.06);
  }
  .card .top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .subject{
    font-weight:700;
    font-size:1.05rem;
    color:var(--green);
  }
  .badge{
    font-size:.75rem;
    padding:4px 10px;
    border-radius:999px;
    font-weight:600;
    white-space:nowrap;
  }
  .badge.scheduled{background:rgba(34,64,47,.1); color:var(--green);}
  .badge.trail{background:rgba(201,151,63,.18); color:var(--warn);}
  .badge.trail_done{background:rgba(47,143,95,.15); color:var(--good);}
  .badge.rescheduled{background:rgba(192,69,63,.15); color:var(--bad);}
  .badge.default{background:rgba(122,117,99,.12); color:var(--muted);}
  .row{
    display:flex;
    justify-content:space-between;
    font-size:.88rem;
    color:var(--muted);
  }
  .row span:last-child{
    color:var(--text);
    font-weight:500;
    text-align:right;
  }
  .meet{
    margin-top:6px;
    text-align:center;
    padding:8px;
    border-radius:8px;
    background:var(--green);
    color:#fff;
    text-decoration:none;
    font-size:.85rem;
    font-weight:600;
  }
  .meet:hover{opacity:.9;}
  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 0;
  }
  footer{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    padding:24px 20px 30px;
    border-top:1px solid var(--border);
    margin-top:20px;
  }
  footer .academy{
    color:var(--green);
    font-weight:700;
    margin-bottom:4px;
  }
  footer a{
    color:var(--gold);
    text-decoration:none;
    font-weight:600;
  }
  footer a:hover{
    text-decoration:underline;
  }
  #liveStatus{
    display:block;
    margin-top:8px;
    font-size:.78rem;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Scope Ark logo">
      <path d="M60 8 C36 8 20 30 20 55 L20 100 L40 100 L40 58 C40 42 48 28 60 28 C72 28 80 42 80 58 L80 100 L100 100 L100 55 C100 30 84 8 60 8 Z"
            fill="none" stroke="#22402f" stroke-width="10" stroke-linejoin="round"/>
      <path d="M60 30 C50 45 68 55 58 70 C50 82 60 92 60 100"
            fill="none" stroke="#c9973f" stroke-width="9" stroke-linecap="round"/>
    </svg>
    <div class="name">SCOPE<span class="ark">ARK</span></div>
  </div>
  <h1>Lessons Schedule</h1>
</header>

<div class="container">
  <div class="stats" id="stats"></div>

  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" style="display:none">No lessons found</div>
</div>

<footer>
  <div class="academy">Scope Ark Online Academy</div>
  <a href="https://www.scopeark.com" target="_blank" rel="noopener">www.scopeark.com</a>
  <span id="liveStatus">Loading...</span>
</footer>

<script>
// Live public "view-only" copy of the Lessons_Schedule sheet (kept in sync via
// an IMPORTRANGE formula in the source spreadsheet). This is a *separate*
// spreadsheet containing only this one tab, so no other sensitive tabs are
// exposed publicly.
const LIVE_SHEET_ID = '1NWhEULW5C6WBMvBEiErt7wy1oywMvFWDVhxcLptxaLo';
const LIVE_CSV_URL = `https://docs.google.com/spreadsheets/d/${LIVE_SHEET_ID}/gviz/tq?tqx=out:csv`;
const REFRESH_MS = 60000; // refresh every 60 seconds

const FIELDS = ['Lesson_ID','Student_ID','Student_Name','Student_TimeZone','Teacher_ID',
  'Teacher_Name','Teacher_TimeZone','Subject','Stage','Day_Name','Actual_Date','Month','Year',
  'Student_Date','Teacher_Date','Day_Index','Start_Time_Student','End_Time_Student',
  'Start_Time_Teacher','End_Time_Teacher','CAIRO_TIME','MEET_LINK','Status','Reason','Note',
  'Added_By','Comment','T_MSG','T_WTS','STD_MSG','STD_WTS'];

let allLessons = [];

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function csvToLessons(text){
  const rows = parseCSV(text).filter(r=>r.some(c=>c !== ''));
  if(rows.length < 2) return [];
  const header = rows[0];
  const idx = {};
  header.forEach((h,i)=>idx[h.trim()] = i);
  const out = [];
  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    const lessonIdCell = idx['Lesson_ID'] !== undefined ? row[idx['Lesson_ID']] : '';
    if(!lessonIdCell) continue;
    const item = {};
    FIELDS.forEach(f=>{
      item[f] = idx[f] !== undefined ? (row[idx[f]] || '') : '';
    });
    out.push(item);
  }
  return out;
}

function setLiveStatus(msg){
  document.getElementById('liveStatus').textContent = msg;
}

async function fetchLive(){
  const res = await fetch(`${LIVE_CSV_URL}&_=${Date.now()}`, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if(text.includes('#REF!') || text.includes('#ERROR!')){
    throw new Error('live sheet not linked yet');
  }
  return csvToLessons(text);
}

async function loadData(isRefresh){
  try{
    allLessons = await fetchLive();
    const now = new Date().toLocaleTimeString('en-US');
    setLiveStatus(`Live data · last updated: ${now} · refreshes every ${REFRESH_MS/1000}s`);
  } catch(err){
    if(!isRefresh){
      // first load fallback to bundled snapshot so the page isn't empty
      try{
        const res = await fetch('data/lessons_schedule.json');
        allLessons = await res.json();
      } catch(e){ allLessons = []; }
    }
    setLiveStatus(`Could not load live data (${err.message}) — showing cached data`);
  }
  render();
}

setInterval(()=>loadData(true), REFRESH_MS);

function badgeClass(status){
  if(!status) return 'default';
  const s = status.toLowerCase();
  if(s === 'scheduled') return 'scheduled';
  if(s === 'trail') return 'trail';
  if(s === 'trail_done') return 'trail_done';
  if(s === 'rescheduled') return 'rescheduled';
  return 'default';
}

function render(){
  const sorted = [...allLessons].sort((a,b)=>
    (a.Teacher_Name||'').localeCompare(b.Teacher_Name||''));

  const cards = document.getElementById('cards');
  const empty = document.getElementById('empty');
  cards.innerHTML = '';

  if(sorted.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    sorted.forEach(l=>{
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="top">
          <span class="subject">${l.Subject || '-'}</span>
          <span class="badge ${badgeClass(l.Status)}">${l.Status || '-'}</span>
        </div>
        <div class="row"><span>Teacher</span><span>${l.Teacher_Name || '-'}</span></div>
        <div class="row"><span>Student</span><span>${l.Student_Name || '-'}</span></div>
        <div class="row"><span>Day</span><span>${l.Day_Name || '-'} (${l.Actual_Date || '-'})</span></div>
        <div class="row"><span>Time (Teacher)</span><span>${l.Start_Time_Teacher || '-'} - ${l.End_Time_Teacher || '-'} (${l.Teacher_TimeZone || '-'})</span></div>
        <div class="row"><span>Cairo Time</span><span>${l.CAIRO_TIME || '-'}</span></div>
        ${l.MEET_LINK ? `<a class="meet" href="https://${l.MEET_LINK}" target="_blank" rel="noopener">Join Lesson</a>` : ''}
      `;
      cards.appendChild(card);
    });
  }

  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${allLessons.length}</b>Total Lessons</div>
  `;
}

loadData();
</script>
</body>
</html>
