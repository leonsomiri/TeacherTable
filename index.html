<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lessons Schedule - Scope Ark</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="m-0 min-h-screen bg-slate-50 text-slate-800 font-sans">
<header class="px-5 pt-8 pb-5 text-center">
  <div class="flex flex-col items-center gap-1.5 mb-3.5">
    <img src="assets/logo.png" alt="Scope Ark logo" width="40" height="40" class="w-10 h-10 object-contain">
    <div class="text-2xl font-bold tracking-wide text-slate-900">SCOPE<span class="text-indigo-600">ARK</span></div>
  </div>
  <h1 class="m-0 text-3xl font-bold text-slate-900">Teacher Lessons Schedule</h1>
</header>

<div id="authGate" class="max-w-sm mx-auto px-4 py-10 text-center">
  <p class="text-slate-600 mb-4">Sign in with your Google account to view your schedule.</p>
  <div id="googleSignInBtn" class="flex justify-center"></div>
  <p id="authError" class="text-rose-600 text-sm mt-4 hidden"></p>
</div>

<div id="appContent" class="max-w-5xl mx-auto px-4 pb-10 hidden">
  <div class="flex justify-between items-center mb-4 text-sm">
    <span id="viewerInfo" class="text-slate-500"></span>
    <button id="signOutBtn" class="text-indigo-600 font-semibold hover:underline">Sign out</button>
  </div>

  <div id="teacherFilterWrap" class="flex justify-center mb-4 hidden">
    <select id="filterTeacher" class="w-full max-w-xs px-3 py-2.5 rounded-lg border border-slate-200 bg-white text-slate-800 text-sm">
      <option value="">All Teachers</option>
    </select>
  </div>

  <div id="stats" class="flex gap-2.5 flex-wrap justify-center mb-4"></div>

  <div id="cards" class="grid gap-3.5" style="grid-template-columns:repeat(auto-fill, minmax(280px,1fr))"></div>
  <div id="empty" class="text-center text-slate-500 py-10 hidden">No lessons found</div>

  <div id="finishedSection" class="hidden">
    <div class="flex items-center gap-3 my-7">
      <div class="flex-1 h-px bg-slate-200"></div>
      <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Finished</span>
      <div class="flex-1 h-px bg-slate-200"></div>
    </div>
    <h2 class="text-lg font-bold text-slate-700 mb-3.5 text-center">Completed Lessons</h2>
    <div id="finishedCards" class="grid gap-3.5" style="grid-template-columns:repeat(auto-fill, minmax(280px,1fr))"></div>
  </div>

  <div id="fixedScheduleSection" class="hidden">
    <div class="h-px bg-slate-200 my-7"></div>
    <h2 class="text-lg font-bold text-slate-700 mb-3.5 text-center">Fixed Schedule</h2>
    <div id="fixedScheduleCards" class="grid gap-3.5" style="grid-template-columns:repeat(auto-fill, minmax(280px,1fr))"></div>
  </div>
</div>

<footer class="text-center text-slate-500 text-sm px-5 pt-6 pb-8 border-t border-slate-200 mt-5">
  <div class="text-slate-900 font-bold mb-1">Scope Ark Online Academy</div>
  <a href="https://www.scopeark.com" target="_blank" rel="noopener" class="text-indigo-600 font-semibold hover:underline">www.scopeark.com</a>
  <span id="liveStatus" class="block mt-2 text-xs">&nbsp;</span>
  <div class="mt-3 text-xs text-slate-500">Corporate website: scopeark.net. &copy; 2026 Scope Ark. All rights reserved.</div>
</footer>

<script>
const GOOGLE_CLIENT_ID = '644310616310-0h05cdaudvv6fjppjh62l9c8uton058o.apps.googleusercontent.com';
const REFRESH_MS = 60000; // refresh every 60 seconds
const VISIBLE_STATUSES = ['scheduled', 'trail', 'rescheduled'];

let idToken = null;
let allLessons = [];
let allFixedSchedule = [];
let isAdmin = false;
let refreshTimer = null;

function setLiveStatus(msg){
  document.getElementById('liveStatus').textContent = msg;
}

function showAuthError(msg){
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function hideAuthError(){
  document.getElementById('authError').classList.add('hidden');
}

function decodeJwtExp(token){
  try{
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return payload.exp ? payload.exp * 1000 : null;
  } catch(e){
    return null;
  }
}

function storeToken(token){
  idToken = token;
  try{ sessionStorage.setItem('idToken', token); } catch(e){}
  scheduleTokenRefresh();
}

function clearToken(){
  idToken = null;
  try{ sessionStorage.removeItem('idToken'); } catch(e){}
  if(refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
}

function attemptSilentRefresh(){
  if(window.google && google.accounts && google.accounts.id) google.accounts.id.prompt();
}

function scheduleTokenRefresh(){
  if(refreshTimer){ clearTimeout(refreshTimer); refreshTimer = null; }
  const exp = decodeJwtExp(idToken);
  if(!exp) return;
  const msUntilRefresh = exp - Date.now() - (5 * 60 * 1000);
  refreshTimer = setTimeout(attemptSilentRefresh, Math.max(msUntilRefresh, 0));
}

function onCredentialResponse(response){
  storeToken(response.credential);
  hideAuthError();
  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('appContent').classList.remove('hidden');
  loadData();
}

function signOut(){
  clearToken();
  allLessons = [];
  if(window.google) google.accounts.id.disableAutoSelect();
  document.getElementById('appContent').classList.add('hidden');
  document.getElementById('authGate').classList.remove('hidden');
}

document.getElementById('signOutBtn').addEventListener('click', signOut);

function tryRestoreSession(){
  let stored = null;
  try{ stored = sessionStorage.getItem('idToken'); } catch(e){}
  if(!stored) return;
  const exp = decodeJwtExp(stored);
  if(!exp || exp <= Date.now()){
    try{ sessionStorage.removeItem('idToken'); } catch(e){}
    return;
  }
  idToken = stored;
  scheduleTokenRefresh();
  document.getElementById('authGate').classList.add('hidden');
  document.getElementById('appContent').classList.remove('hidden');
  loadData();
}

function initGoogleSignIn(attemptsLeft){
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: onCredentialResponse,
      auto_select: true,
    });
    google.accounts.id.renderButton(document.getElementById('googleSignInBtn'), {
      theme: 'outline', size: 'large', text: 'signin_with',
    });
    tryRestoreSession();
    return;
  }
  if(attemptsLeft <= 0){
    showAuthError('Could not load Google Sign-In. Check your connection and reload the page.');
    return;
  }
  setTimeout(()=>initGoogleSignIn(attemptsLeft - 1), 300);
}

window.addEventListener('load', function(){ initGoogleSignIn(20); });

async function loadData(isRefresh){
  if(!idToken) return;
  try{
    const res = await fetch('/api/schedule', {
      headers: { Authorization: 'Bearer ' + idToken },
      cache: 'no-store',
    });

    if(res.status === 401){
      setLiveStatus('Session expired.');
      signOut();
      showAuthError('Your session expired. Please sign in again.');
      return;
    }
    if(res.status === 403){
      const data = await res.json().catch(()=>({}));
      signOut();
      showAuthError(data.error || 'No schedule found for this Google account.');
      return;
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    allLessons = data.lessons || [];
    allFixedSchedule = data.fixedSchedule || [];
    isAdmin = Boolean(data.isAdmin);

    document.getElementById('teacherFilterWrap').classList.toggle('hidden', !isAdmin);
    document.getElementById('viewerInfo').textContent = isAdmin
      ? `Signed in as ${data.viewerName || 'Admin'} (viewing all teachers)`
      : `Signed in as ${data.viewerName || ''}`;

    const now = new Date().toLocaleTimeString('en-US');
    setLiveStatus(`Live data · last updated: ${now} · refreshes every ${REFRESH_MS/1000}s`);
  } catch(err){
    setLiveStatus(`Could not load data (${err.message})`);
  }
  populateTeacherFilter();
  render();
}

setInterval(()=>{ if(idToken) loadData(true); }, REFRESH_MS);

function dayNameFromDate(dateStr){
  if(!dateStr) return '';
  let y, m, d;
  const iso = dateStr.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  const us = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(iso){ y = +iso[1]; m = +iso[2]; d = +iso[3]; }
  else if(us){ m = +us[1]; d = +us[2]; y = +us[3]; }
  else return '';
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.toLocaleDateString('en-US', {weekday: 'long', timeZone: 'UTC'});
}

function adminTimeSortKey(str){
  if(!str) return Infinity;
  const dateMatch = str.match(/(\d{4})-(\d{1,2})-(\d{1,2})/) || str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!dateMatch) return Infinity;
  let y, m, d;
  if(dateMatch[0].indexOf('-') > -1 && dateMatch[1].length === 4){
    y = +dateMatch[1]; m = +dateMatch[2]; d = +dateMatch[3];
  } else {
    m = +dateMatch[1]; d = +dateMatch[2]; y = +dateMatch[3];
  }
  const timeMatch = str.match(/(\d{1,2}):(\d{2})(:(\d{2}))?/);
  const hh = timeMatch ? +timeMatch[1] : 0;
  const mm = timeMatch ? +timeMatch[2] : 0;
  const ss = timeMatch && timeMatch[4] ? +timeMatch[4] : 0;
  return Date.UTC(y, m - 1, d, hh, mm, ss);
}

function badgeClasses(status){
  const s = (status || '').toLowerCase();
  if(s === 'scheduled') return 'bg-indigo-50 text-indigo-700';
  if(s === 'trail') return 'bg-amber-50 text-amber-700';
  if(s === 'trail_done') return 'bg-emerald-50 text-emerald-700';
  if(s === 'rescheduled') return 'bg-rose-50 text-rose-700';
  return 'bg-slate-100 text-slate-500';
}

function statusLabel(status){
  if(!status) return '-';
  if(status.toLowerCase() === 'trail') return 'Trial';
  return status;
}

function headerGradient(status){
  const s = (status || '').toLowerCase();
  if(s === 'scheduled') return 'from-indigo-600 to-indigo-800';
  if(s === 'trail') return 'from-amber-500 to-amber-700';
  if(s === 'trail_done') return 'from-emerald-500 to-emerald-700';
  if(s === 'rescheduled') return 'from-rose-500 to-rose-700';
  return 'from-slate-500 to-slate-700';
}

const FINISHED_HEADER_GRADIENT = 'from-slate-500 to-slate-700';

const WEEKDAY_ORDER = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function timeStringToMinutes(str){
  const m = (str || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m) return 0;
  let h = (+m[1]) % 12;
  if(/pm/i.test(m[3])) h += 12;
  return h * 60 + (+m[2]);
}

function fixedScheduleSortKey(item){
  const dayIndex = WEEKDAY_ORDER.indexOf(item.Day_Teacher);
  return (dayIndex === -1 ? 7 : dayIndex) * 10000 + timeStringToMinutes(item.Start_Time_Teacher);
}

const FIXED_SCHEDULE_HEADER_GRADIENT = 'from-teal-600 to-emerald-800';

function buildFixedCard(item){
  const card = document.createElement('div');
  card.className = 'bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex flex-col gap-2 shadow-sm';
  const time = `${item.Start_Time_Teacher || '-'} - ${item.End_Time_Teacher || '-'} (${item.Teacher_TimeZone || '-'})`;
  card.innerHTML = `
    <div class="flex items-center gap-2 -mx-4 -mt-4 mb-1 px-4 py-2.5 rounded-t-2xl text-white font-bold text-lg bg-gradient-to-b ${FIXED_SCHEDULE_HEADER_GRADIENT} shadow-[inset_0_1px_0_rgba(255,255,255,0.35),inset_0_-2px_4px_rgba(0,0,0,0.2),0_2px_4px_rgba(0,0,0,0.2)]">
      <i data-lucide="user" class="w-4 h-4"></i>${item.Teacher_Name || '-'}
    </div>
    <div class="flex items-center gap-1.5 font-semibold text-sm text-emerald-700"><i data-lucide="book-open" class="w-3.5 h-3.5"></i>${item.Subject || '-'}</div>
    ${row('graduation-cap', 'Student', item.Student_Name || '-')}
    ${row('calendar', 'Day', item.Day_Teacher || '-')}
    ${row('clock', 'Time (Teacher)', time)}
  `;
  return card;
}

function populateTeacherFilter(){
  const sel = document.getElementById('filterTeacher');
  const prev = sel.value;
  const teachersById = new Map();
  [...allLessons, ...allFixedSchedule].forEach(item=>{
    if(item.Teacher_ID && item.Teacher_Name && !teachersById.has(item.Teacher_ID)){
      teachersById.set(item.Teacher_ID, item.Teacher_Name);
    }
  });
  const teachers = [...teachersById.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  sel.innerHTML = '<option value="">All Teachers</option>';
  teachers.forEach(([id, name])=>{
    const o = document.createElement('option');
    o.value = id; o.textContent = name;
    sel.appendChild(o);
  });
  if(teachersById.has(prev)) sel.value = prev;
}

function row(icon, label, value){
  return `
    <div class="flex justify-between items-start text-sm text-slate-500 gap-2">
      <span class="flex items-center gap-1.5 shrink-0"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${label}</span>
      <span class="text-slate-800 font-medium text-right">${value}</span>
    </div>`;
}

function buildCard(l, gradient){
  const card = document.createElement('div');
  card.className = 'bg-white border border-slate-200 rounded-2xl p-4 flex flex-col gap-2 shadow-sm';
  const day = `${l.Teacher_Date || '-'}${dayNameFromDate(l.Teacher_Date) ? ' (' + dayNameFromDate(l.Teacher_Date) + ')' : ''}`;
  const time = `${l.Start_Time_Teacher || '-'} - ${l.End_Time_Teacher || '-'} (${l.Teacher_TimeZone || '-'})`;
  card.innerHTML = `
    <div class="flex items-center gap-2 -mx-4 -mt-4 mb-1 px-4 py-2.5 rounded-t-2xl text-white font-bold text-lg bg-gradient-to-b ${gradient} shadow-[inset_0_1px_0_rgba(255,255,255,0.35),inset_0_-2px_4px_rgba(0,0,0,0.2),0_2px_4px_rgba(0,0,0,0.2)]">
      <i data-lucide="user" class="w-4 h-4"></i>${l.Teacher_Name || '-'}
    </div>
    <div class="flex justify-between items-center">
      <span class="flex items-center gap-1.5 font-semibold text-sm text-indigo-600"><i data-lucide="book-open" class="w-3.5 h-3.5"></i>${l.Subject || '-'}</span>
      <span class="text-xs px-2.5 py-1 rounded-full font-semibold whitespace-nowrap ${badgeClasses(l.Status)}">${statusLabel(l.Status)}</span>
    </div>
    ${row('graduation-cap', 'Student', l.Student_Name || '-')}
    ${row('calendar', 'Day', day)}
    ${row('clock', 'Time (Teacher)', time)}
    ${row('building-2', 'Admin Time', l.CAIRO_TIME || '-')}
    ${l.MEET_LINK ? `<a class="mt-1.5 flex items-center justify-center gap-1.5 text-center py-2 rounded-lg bg-slate-900 text-white no-underline text-sm font-semibold hover:opacity-90" href="https://${l.MEET_LINK}" target="_blank" rel="noopener"><i data-lucide="video" class="w-4 h-4"></i>Join Lesson</a>` : ''}
  `;
  return card;
}

function render(){
  const teacherFilter = document.getElementById('filterTeacher').value;

  const filtered = allLessons.filter(l=>!isAdmin || !teacherFilter || l.Teacher_ID === teacherFilter);
  const byTimeAsc = (a,b)=>adminTimeSortKey(a.CAIRO_TIME) - adminTimeSortKey(b.CAIRO_TIME);
  const teacherTimeKey = l=>adminTimeSortKey(`${l.Teacher_Date || ''} ${l.Start_Time_Teacher || ''}`);
  const byTimeDesc = (a,b)=>teacherTimeKey(b) - teacherTimeKey(a);

  const current = filtered
    .filter(l=>VISIBLE_STATUSES.includes((l.Status||'').toLowerCase()))
    .sort(byTimeAsc);
  const finished = filtered
    .filter(l=>!VISIBLE_STATUSES.includes((l.Status||'').toLowerCase()))
    .sort(byTimeDesc);

  const cards = document.getElementById('cards');
  const empty = document.getElementById('empty');
  const finishedSection = document.getElementById('finishedSection');
  const finishedCards = document.getElementById('finishedCards');
  cards.innerHTML = '';
  finishedCards.innerHTML = '';

  empty.classList.toggle('hidden', current.length !== 0 || finished.length !== 0);
  current.forEach(l=>cards.appendChild(buildCard(l, headerGradient(l.Status))));

  finishedSection.classList.toggle('hidden', finished.length === 0);
  finished.forEach(l=>finishedCards.appendChild(buildCard(l, FINISHED_HEADER_GRADIENT)));

  const fixedFiltered = allFixedSchedule
    .filter(f=>!isAdmin || !teacherFilter || f.Teacher_ID === teacherFilter)
    .sort((a,b)=>fixedScheduleSortKey(a) - fixedScheduleSortKey(b));
  const fixedScheduleSection = document.getElementById('fixedScheduleSection');
  const fixedScheduleCards = document.getElementById('fixedScheduleCards');
  fixedScheduleCards.innerHTML = '';
  fixedScheduleSection.classList.toggle('hidden', fixedFiltered.length === 0);
  fixedFiltered.forEach(f=>fixedScheduleCards.appendChild(buildFixedCard(f)));

  const total = current.length + finished.length;
  document.getElementById('stats').innerHTML = `
    <div class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-500 text-center">
      <b class="block text-slate-900 text-lg">${total}</b>Lessons Shown
    </div>
  `;

  if(window.lucide) lucide.createIcons();
}

document.getElementById('filterTeacher').addEventListener('change', render);
</script>
</body>
</html>
